<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="description" content="Fast Wardogs mortar range calculator using X and Z coordinates.">
  <title>Wardogs Mortar Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f0c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235cff8a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%235cff8a'/%3E%3Cpath d='M16 4v4M16 24v4M4 16h4M24 16h4' stroke='%235cff8a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">Wardogs</p>
      <h1>Mortar Calculator</h1>
    </header>

    <form id="calc-form" autocomplete="off" novalidate>
      <section class="panel" aria-labelledby="mortar-label">
        <h2 id="mortar-label">Mortar Position</h2>
        <div class="coords">
          <label>
            <span>X</span>
            <input id="mortar-x" name="mortarX" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="65.33">
          </label>
          <label>
            <span>Z</span>
            <input id="mortar-z" name="mortarZ" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="72.33">
          </label>
        </div>
      </section>

      <section class="panel" aria-labelledby="target-label">
        <h2 id="target-label">Target Position</h2>
        <div class="coords">
          <label>
            <span>X</span>
            <input id="target-x" name="targetX" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="80.10">
          </label>
          <label>
            <span>Z</span>
            <input id="target-z" name="targetZ" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="90.50">
          </label>
        </div>
      </section>
    </form>

    <section class="result" aria-live="polite">
      <p class="result-label">🎯 DISTANCE</p>
      <p id="distance" class="result-value">—</p>
      <p id="hint" class="hint">Based on 1 coordinate unit ≈ 100 metres</p>
    </section>

    <div class="actions">
      <button id="clear" type="button">Clear</button>
      <p class="shortcuts">Tab to next field · Esc to clear</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>

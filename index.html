<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0c">
  <meta name="description" content="Wardogs L81 mortar distance calculator with interactive map.">
  <title>Wardogs Mortar Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f0c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235cff8a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%235cff8a'/%3E%3Cpath d='M16 4v4M16 24v4M4 16h4M24 16h4' stroke='%235cff8a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="kicker">Wardogs</p>
        <h1>Mortar Calculator</h1>
      </div>
      <div class="map-tabs" role="tablist" aria-label="Map">
        <button type="button" class="map-tab" data-map="bakurani" role="tab" aria-selected="false">Bakurani</button>
        <button type="button" class="map-tab" data-map="ozeti" role="tab" aria-selected="false">Ozeti</button>
        <button type="button" class="map-tab is-active" data-map="zestafona" role="tab" aria-selected="true">Zestafona</button>
      </div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Tools">
      <button type="button" class="tool is-active" data-tool="mortar" id="tool-mortar">
        <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 18l8-8 3 3 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="7" cy="15" r="2.2" fill="currentColor"/>
        </svg>
        <span>Mortar</span>
      </button>
      <button type="button" class="tool" data-tool="target" id="tool-target">
        <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
        </svg>
        <span>Target</span>
      </button>
    </div>

    <div class="map-shell">
      <canvas id="map" aria-label="Tactical map"></canvas>
      <p class="map-hint" id="map-hint">Click to place mortar</p>
      <p class="cursor-coords" id="cursor-coords">X — · Y —</p>
    </div>

    <section class="result" aria-live="polite">
      <p class="result-label">DISTANCE</p>
      <p id="distance" class="result-value is-empty">Place mortar</p>
      <p id="range-status" class="range-status" hidden></p>
    </section>

    <button type="button" class="clear-btn" id="clear">Clear</button>

    <details class="manual">
      <summary>Manual coordinates</summary>
      <form id="calc-form" autocomplete="off" novalidate>
        <section class="panel" aria-labelledby="mortar-label">
          <h2 id="mortar-label">Mortar</h2>
          <div class="coords">
            <label>
              <span>X</span>
              <input id="mortar-x" name="mortarX" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="65.33">
            </label>
            <label>
              <span>Y</span>
              <input id="mortar-y" name="mortarY" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="72.33">
            </label>
          </div>
        </section>
        <section class="panel" aria-labelledby="target-label">
          <h2 id="target-label">Target</h2>
          <div class="coords">
            <label>
              <span>X</span>
              <input id="target-x" name="targetX" type="text" inputmode="decimal" enterkeyhint="next" spellcheck="false" placeholder="80.10">
            </label>
            <label>
              <span>Y</span>
              <input id="target-y" name="targetY" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="90.50">
            </label>
          </div>
        </section>
      </form>
    </details>
  </main>
  <script src="script.js"></script>
</body>
</html>
